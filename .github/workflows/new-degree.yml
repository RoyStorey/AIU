name: New degree program

# Run from the Actions tab: enter a degree title and AIU's curriculum
# committee (Claude) drafts the plan and course materials, then opens a PR.
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Degree title, e.g. "Bachelor of Science in Nursing"'
        required: true
      notes:
        description: "Optional guidance for the curriculum (focus areas, required courses, tone)"
        required: false
      terms:
        description: 'Terms to write course materials for: blank = all 20, "1-5" = first year, "none" = plan only'
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate degree
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIU_MODEL: ${{ vars.AIU_MODEL }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          TERMS: ${{ inputs.terms }}
        run: |
          args=()
          if [ "$TERMS" = "none" ]; then args+=(--plan-only); elif [ -n "$TERMS" ]; then args+=(--terms "$TERMS"); fi
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); fi
          npm run degree:new -- "$TITLE" "${args[@]}" 2>&1 | tee generation.log

      - run: npm run content:validate

      - name: Summarize
        id: summary
        run: |
          {
            echo 'log<<EOF'
            tail -n 30 generation.log
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm generation.log

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: degree/${{ github.run_id }}
          commit-message: "Add degree: ${{ inputs.title }}"
          title: "New degree: ${{ inputs.title }}"
          body: |
            Generated by the **New degree program** workflow.

            ```
            ${{ steps.summary.outputs.log }}
            ```

            Review the degree map and a few courses in the Vercel/preview deployment (or locally with `npm run dev`), then merge to publish.
