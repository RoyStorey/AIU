name: Generate course materials

# Publish materials for courses that are still "in development", for example
# the next year of an existing program.
on:
  workflow_dispatch:
    inputs:
      program:
        description: "Program slug, e.g. bs-computer-science (blank = every unpublished course)"
        required: false
      terms:
        description: 'Terms to cover, e.g. "6-10" (blank = all)'
        required: false
      limit:
        description: "Maximum number of courses to generate this run (blank = no limit)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIU_MODEL: ${{ vars.AIU_MODEL }}
          PROGRAM: ${{ inputs.program }}
          TERMS: ${{ inputs.terms }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "$PROGRAM" ]; then args+=(--program "$PROGRAM"); else args+=(--all); fi
          if [ -n "$TERMS" ]; then args+=(--terms "$TERMS"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          npm run courses:generate -- "${args[@]}"
      - run: npm run content:validate
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: courses/${{ github.run_id }}
          commit-message: "Publish course materials${{ inputs.program && format(' for {0}', inputs.program) || '' }}"
          title: "Course materials${{ inputs.program && format(': {0}', inputs.program) || '' }}${{ inputs.terms && format(' (terms {0})', inputs.terms) || '' }}"
          body: Generated by the **Generate course materials** workflow. Review a few lessons, then merge to publish.
